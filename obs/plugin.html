<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="../connection/connect.js"></script>
</head>

<body>
    <section>
        <div class="timer">
            <p id="time-status" class="status"></p>
            <div class="counter">
                <p id="counter">
                    <span id="minutes">00</span>:<span id="seconds">00</span>
                </p>
            </div>
        </div>

        <div class="competidor blue">
            <div>
                <div class="pontos">
                    <!-- <p id="bs4" class="-js-get-id ponto">00</p>
                        <p id="bs3" class="-js-get-id ponto">00</p>
                        <p id="bs2" class="-js-get-id ponto">00</p> -->
                    <div class="v-p">
                        <p class="van">
                            <span id="bv" class="-js-get-id display">00</span>
                        </p>
                        <p class="pun">
                            <span id="bp" class="-js-get-id display">00</span>
                        </p>
                    </div>
                </div>
                <div class="total">
                    <!-- <p id="bstatus" class="status-final">0</p> -->
                    <p id="bt" class="-js-get-id total-ponto">00</p>
                </div>
            </div>
        </div>


        <div class="competidor white">
            <div>
                <div class="pontos">
                    <!-- <p id="ws4" class="-js-get-id ponto">00</p>
                    <p id="ws3" class="-js-get-id ponto">00</p>
                    <p id="ws2" class="-js-get-id ponto">00</p> -->
                    <div class="v-p">
                        <p class="van">
                            <span id="wv" class="-js-get-id display">00</span>
                        </p>
                        <p class="pun">
                            <span id="wp" class="-js-get-id display">00</span>
                        </p>
                    </div>
                </div>
                <div class="total">
                    <!-- <p id="wstatus" class="status-final">0</p> -->
                    <p id="wt" class="-js-get-id total-ponto">00</p>
                </div>
            </div>
        </div>
        </div>
    </section>


    <script>
        const statusDisplay = document.getElementById('time-status');
        const counter = document.getElementById('counter');
        const mmCounter = document.getElementById('minutes');
        const ssCounter = document.getElementById('seconds');

        fieldsId = [];
        const getFields = document.querySelectorAll('.-js-get-id');
        getFields.forEach(field => {
            fieldsId.push(field.getAttribute('id'));
        });

        ws.addEventListener('message', ({ data }) => {
            let parsedData = JSON.parse(data);
            let key = parsedData;

            if ('pTimer' in parsedData) {
                updateTimer(parsedData['pTimer']);
            };

            if ('placar' in parsedData) {
                updatePlacar(parsedData['placar']);
            };
        });

        function updatePlacar(values) {
            fieldsId.forEach(id => {
                let element = document.getElementById(id)
                let content = values[id[0]][id.slice([-1])]

                element.textContent = addZeroes(content, 2)
            })
        };

        function updateTimer(values) {
            console.log(values);

            ['paused', 'running', 'stopped'].forEach(status => {
                statusDisplay.classList.remove(status);
            });

            mmCounter.textContent = addZeroes(values.mm, 2);
            ssCounter.textContent = addZeroes(values.ss, 2);

            statusDisplay.textContent = values.timerStatus.text;
            statusDisplay.classList.add(values.timerStatus.status);
        };

        function addZeroes(num, len) {
            let numberWithZeroes = String(num);
            let counter = numberWithZeroes.length;

            while (counter < len) {
                numberWithZeroes = "0" + numberWithZeroes;
                counter++;
            };
            return numberWithZeroes;
        };
    </script>
</body>

</html>
