<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Browser source</title>

        <!-- Script -->
        <script defer src="src/interaction.js"></script>

        <!-- CSS -->
        <link rel="stylesheet" href="src/source_style.css" />
        <link rel="icon" href="../favicon.svg" />

        <!-- Handle websocket and broadcast inputs -->
        <script defer src="./src/listenner_connection.js"></script>
        <script defer src="./src/listenner_broadcast.js"></script>
    </head>

    <body>
        <section id="scoreboard" class="scoreboard">
            <div class="timer">
                <p id="time-status" class="status">Parado</p>
                <div class="counter">
                    <p id="counter">
                        <span id="minutes">00</span>:<span id="seconds"
                            >00</span
                        >
                    </p>
                </div>
            </div>

            <div class="competitor blue">
                <div>
                    <div class="nome">
                        <span id="bname" class="nome-lutador"></span>
                        <br />
                        <div class="extras">
                            <span id="bteam" class="nome-equipe"></span>
                            <span id="bstatus" class="status-final"></span>
                        </div>
                    </div>
                    <div class="pontos">
                        <div class="total">
                            <p id="bt" class="-js-get-id total-ponto">00</p>
                        </div>
                        <div class="v-p">
                            <p class="van">
                                <span id="bv" class="-js-get-id display"
                                    >00</span
                                >
                            </p>
                            <p class="pun">
                                <span id="bp" class="-js-get-id display"
                                    >0</span
                                >
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="competitor white">
                <div>
                    <div class="nome">
                        <span id="wname" class="nome-lutador"></span>
                        <br />
                        <div class="extras">
                            <span id="wteam" class="nome-equipe"></span>
                            <span id="wstatus" class="status-final"></span>
                        </div>
                    </div>
                    <div class="pontos">
                        <div class="total">
                            <p id="wt" class="-js-get-id total-ponto">00</p>
                        </div>
                        <div class="v-p">
                            <p class="van">
                                <span id="wv" class="-js-get-id display"
                                    >00</span
                                >
                            </p>
                            <p class="pun">
                                <span id="wp" class="-js-get-id display"
                                    >0</span
                                >
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="pop-up-wrapper" class="pop-up-wrapper">
            <!-- Pop-ups are shown via javascript -->
        </section>

        <section class="sponsors">
            <div class="carrousel-container">
                <div id="carrousel" class="carrousel-slider">
                    <!-- Put the images on via javascript -->
                </div>
            </div>
            <span id="sponsorKind" class="sponsors__kind">:</span>
        </section>
    </body>
</html>
