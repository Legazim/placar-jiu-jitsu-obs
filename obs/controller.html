<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller</title>
    <script defer src="src/controller.js"></script>
    <link rel="stylesheet" href="src/controller_style.css">
</head>

<body>
    <div>
        <label>Mostrar placar</label>
        <input type="checkbox" id="mostrar-placar" checked>
    </div>

    <div>
        <label>Mostrar patrocínios</label>
        <input type="checkbox" id="mostrar-patrocinios" checked>
    </div>

    <div>
        <label>Mostrar pontos marcados (Pop up)</label>
        <input type="checkbox" id="mostrar-pop-up" checked>
    </div>

    <div class="nomes">
        <div class="blue">
            <label>Lutador lado azul</label>
            <input id="blue-name" type="text" placeholder="Nome">
            <input id="blue-team" type="text" placeholder="Equipe">
        </div>
        <div class="white">
            <label>Lutador lado branco</label>
            <input id="white-name" type="text" placeholder="Nome">
            <input id="white-team" type="text" placeholder="Equipe">
        </div>
    </div>

    <div class="options">
        <button type="submit" id="alterNames">Alterar nomes</button>
        <button id="saveNames">Salvar nomes</button>
    </div>

    <div class="lutas">
        <label>Lutas salvas</label>
        <select name="lutas" id="lutas">
            <option value="" disabled selected hidden>Selecionar luta salva</option>
        </select>
    </div>

    <div class="options">
        <button id="apagarLuta">Apagar luta selecionada</button>
    </div>
</body>

</html>
