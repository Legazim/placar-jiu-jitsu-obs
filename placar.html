<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Placar</title>
</head>
<body>
    <div class="container">
        <div class="competidores">
            <div class="competidor azul">
                <div>
                    <span id="bs4" class="pontos">00</span>
                    <span id="bs3" class="pontos">00</span>
                    <span id="bs2" class="pontos">00</span>
                </div>
                <div class="vantagens-e-punicoes">
                    <span id="bv" class="vantagens">00</span>
                    <span id="bp" class="punicoes">00</span>
                </div>
            </div>
            <div class="competidor branco">
                <div>
                    <span id="ws4" class="pontos">00</span>
                    <span id="ws3" class="pontos">00</span>
                    <span id="ws2" class="pontos">00</span>
                </div>
                <div class="vantagens-e-punicoes">
                    <span id="wv" class="vantagens">00</span>
                    <span id="wp" class="punicoes">00</span>
                </div>
            </div>
        </div>
        <div class="total">
            <span class="total">00</span>
            <div class="tempo">
                <span class="status-tempo">00</span>
                <span>00</span>
            </div>
            <span class="total">00</span>
        </div>
    </div>
    <script src="script.js"></script>

</html>
