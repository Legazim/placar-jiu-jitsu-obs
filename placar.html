<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Placar</title>
</head>
<body>
    <div class="container">
        <div class="competidores">
            <div class="competidor azul">
                <div class="pontos">
                    <span id="bs4" class="-js-get-id ponto">00</span>
                    <span id="bs3" class="-js-get-id ponto">00</span>
                    <span id="bs2" class="-js-get-id ponto">00</span>
                </div>
                <div class="van-pun">
                    <span id="bv" class="-js-get-id van">00</span>
                    <span id="bp" class="-js-get-id pun">00</span>
                </div>
            </div>
            <div class="competidor branco">
                <div>
                    <span id="ws4" class="-js-get-id ponto">00</span>
                    <span id="ws3" class="-js-get-id ponto">00</span>
                    <span id="ws2" class="-js-get-id ponto">00</span>
                </div>
                <div class="van-pun">
                    <span id="wv" class="-js-get-id van">00</span>
                    <span id="wp" class="-js-get-id pun">00</span>
                </div>
            </div>
        </div>
        <div class="total">
            <span id="bt" class="-js-get-id">00</span>
            <div class="tempo">
                <p><span id="time-status"></span></p>
                <h1 id="counter"><span id="minutes">00</span>:<span id="seconds">00</span></h1>
            </div>
            <span id="wt" class="-js-get-id">00</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
